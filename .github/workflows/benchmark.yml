name: Benchmark

# Runs the full benchmark against Oracle Database 23ai Free in a service container,
# then commits the generated results (results/ and docs/cover.png) back to the repository.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sql/**"
      - "cases/**"
      - "bench/**"
      - ".github/workflows/benchmark.yml"

permissions:
  contents: write

concurrency:
  group: benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: ChangeMe_123
          APP_USER: demo
          APP_USER_PASSWORD: demo
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 60
    env:
      BENCH_ENV: "GitHub Actions ubuntu-latest runner, Oracle Database Free in a service container"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r bench/requirements.txt

      - name: Run benchmark
        run: python bench/bench.py --setup --system-password ChangeMe_123

      - name: Build charts
        run: python bench/charts.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            results/
            docs/cover.png

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results docs
          if git diff --cached --quiet; then
            echo "No changes in results"
          else
            git commit -m "Update benchmark results [skip ci]"
            git push
          fi
